<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const {useState, useEffect} = React;
const fmtDate = () => new Date().toLocaleDateString("en-IN",{weekday:"short",day:"numeric",month:"short",year:"numeric"});

// --- MILITARY-GRADE ENCRYPTED STORAGE ---
function useSecureStorage(key, init, secretKey) {
  const [val, setVal] = useState(() => {
    try {
      const encryptedData = window.localStorage.getItem(key);
      if (encryptedData !== null) {
        if (secretKey) {
          const bytes = CryptoJS.AES.decrypt(encryptedData, secretKey);
          const decrypted = bytes.toString(CryptoJS.enc.Utf8);
          return JSON.parse(decrypted);
        }
        return init; 
      }
      return init;
    } catch(e) { return init; }
  });

  useEffect(() => {
    const handleStorage = (e) => {
      if (e.detail && e.detail.key === key) setVal(e.detail.val);
    };
    window.addEventListener("local-storage-sync", handleStorage);
    return () => window.removeEventListener("local-storage-sync", handleStorage);
  }, [key]);

  const save = (v) => {
    setVal(v);
    try { 
      if (secretKey) {
        const encrypted = CryptoJS.AES.encrypt(JSON.stringify(v), secretKey).toString();
        window.localStorage.setItem(key, encrypted); 
      }
    } catch(e) {}
    window.dispatchEvent(new CustomEvent("local-storage-sync", { detail: { key, val: v } }));
  };
  return [val, save];
}

function useLocalStorage(key, init) {
  const [val, setVal] = useState(() => {
    try {
      const x = window.localStorage.getItem(key);
      return x !== null ? JSON.parse(x) : init;
    } catch(e) { return init; }
  });
  const save = (v) => {
    setVal(v);
    try { window.localStorage.setItem(key, JSON.stringify(v)); } catch(e) {}
  };
  return [val, save];
}

const PALETTE=[
  {bg:"#EEF0FF",tx:"#5E5CE6",br:"#5E5CE6"},{bg:"#EAF3DE",tx:"#27500A",br:"#639922"},
  {bg:"#FAEEDA",tx:"#633806",br:"#EF9F27"},{bg:"#FBEAF0",tx:"#72243E",br:"#D4537E"},
  {bg:"#E6F1FB",tx:"#0C447C",br:"#378ADD"},{bg:"#E8E6E0",tx:"#2C2C2A",br:"#B4B2A9"}
];

function Tag({label,sel,onClick,bg,tx,br}){
  return <button className="tbtn" onClick={onClick} style={{background:sel?(bg||"#EEF0FF"):"transparent",color:sel?(tx||"#5E5CE6"):"#8E8E93",border:sel?"1.5px solid "+(br||"#5E5CE6"):"1px solid #E5E5EA",fontWeight:sel?700:400}}>{label}</button>;
}

function Dur({h,m,sh,sm}){
  return <div style={{display:"flex",gap:16,alignItems:"center"}}>
    <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:6}}>
      <span style={{fontSize:10,color:"#8E8E93",fontWeight:700,letterSpacing:1}}>HOURS</span>
      <div style={{display:"flex",alignItems:"center",gap:8}}>
        <button className="sbtn" onClick={()=>sh(Math.max(0,h-1))}>-</button>
        <span style={{fontSize:22,fontWeight:700,minWidth:32,textAlign:"center",fontFamily:"'Outfit',sans-serif"}}>{h}</span>
        <button className="sbtn" onClick={()=>sh(Math.min(12,h+1))}>+</button>
      </div>
    </div>
    <span style={{fontSize:24,color:"#C7C7CC",marginTop:18,fontFamily:"'Outfit',sans-serif"}}>:</span>
    <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:6}}>
      <span style={{fontSize:10,color:"#8E8E93",fontWeight:700,letterSpacing:1}}>MINS</span>
      <div style={{display:"flex",alignItems:"center",gap:8}}>
        <button className="sbtn" onClick={()=>sm(Math.max(0,m-5))}>-</button>
        <span style={{fontSize:22,fontWeight:700,minWidth:32,textAlign:"center",fontFamily:"'Outfit',sans-serif"}}>{m}</span>
        <button className="sbtn" onClick={()=>sm(Math.min(55,m+5))}>+</button>
      </div>
    </div>
  </div>;
}

// --- DIRECT API ENGINE (Inline Generation) ---
function AIBtn({prompt, label, sessionKey}){
  const [load, setLoad] = useState(false);
  const [res, setRes] = useState("");
  const [apiKey, setApiKey] = useSecureStorage("gemini_api_key", "", sessionKey);
  const [identity] = useSecureStorage("sys_ctx", "", sessionKey);

  async function run(){
    let currentKey = apiKey;
    if(!currentKey){
      currentKey = window.prompt("James, please enter your Gemini API Key.\n(It will be locked in the encrypted vault for future use):");
      if(!currentKey) return; 
      setApiKey(currentKey);
    }

    setLoad(true); setRes("");
    try{
      const r = await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key="+currentKey,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          contents: [{ parts: [{ text: `ABOUT ME:\n${identity}\n\nDATA:\n${prompt}` }] }]
        })
      });
      const d = await r.json();
      
      if(d.error){
        setRes("API Error: "+d.error.message);
        if(d.error.code === 400 || d.error.code === 403) setApiKey(""); 
      } else {
        setRes(d.candidates[0].content.parts[0].text);
      }
    } catch(e) {
      setRes("Network Error. Check your internet connection.");
    }
    setLoad(false);
  }

  return <div style={{marginTop: 16}}>
    <button onClick={run} disabled={load} className="pbtn" style={{background: load ? "#C7C7CC" : "#1C1C1E", marginTop: 0}}>
      {load ? "Analysing patterns..." : "✦ " + label}
    </button>
    {res && <div className="ai-output">{res}</div>}
  </div>;
}

// --- TABS ---
function Activity({ sessionKey }) {
  const [entries, setEntries] = useSecureStorage("entries_activity", [], sessionKey);
  const [actStr] = useSecureStorage("sys_act", "Prayer & Bible, Gym & fitness, Deep work, Office work, Study (AI/PMP), Finance action, Family time, Meals, Commute, Distraction, Rest, Other", sessionKey);
  const [text, setText] = useState("");
  const [cat, setCat] = useState(null);
  const [h, setH] = useState(0);
  const [m, setM] = useState(30);
  const [time, setTime] = useState(() => {
    const n = new Date();
    return String(n.getHours()).padStart(2, "0") + ":" + String(n.getMinutes()).padStart(2, "0");
  });

  const categories = (actStr || "").split(",").map((t, i) => ({ n: t.trim(), ...PALETTE[i % PALETTE.length] })).filter(x => x.n);

  function add() {
    if (!text.trim() || !cat) return alert("Fill entry and select category");
    setEntries([...entries, { id: Date.now(), text, cat, mins: h * 60 + m, time, date: fmtDate() }]);
    setText(""); setCat(null); setH(0); setM(30);
  }

  const total = entries.reduce((s, e) => s + e.mins, 0);
  const log = entries.map(e => `${e.time} | ${e.cat} | ${e.mins}m | ${e.text}`).join("\n");

  return (
    <div>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginBottom: 18 }}>
        <div style={{ background: "#232528", borderRadius: 16, padding: 16, color: "#F8F7F2", textAlign: "center" }}>
          <div style={{ fontSize: 28, fontFamily: "'Outfit',sans-serif", fontWeight: 800 }}>{entries.length}</div>
          <div style={{ fontSize: 11, color: "#C4BEAD", marginTop: 4, letterSpacing: 1 }}>ENTRIES</div>
        </div>
        <div style={{ background: "#232528", borderRadius: 16, padding: 16, color: "#F8F7F2", textAlign: "center" }}>
          <div style={{ fontSize: 24, fontFamily: "'Outfit',sans-serif", fontWeight: 800, marginTop: 2 }}>{Math.floor(total / 60)}h {total % 60}m</div>
          <div style={{ fontSize: 11, color: "#C4BEAD", marginTop: 4, letterSpacing: 1 }}>TRACKED</div>
        </div>
      </div>
      <div className="card">
        <h3 style={{marginBottom: 10}}>◎ Activity Log</h3>
        <span className="lbl">Start Time</span>
        <input type="time" value={time} onChange={e => setTime(e.target.value)} className="inp" style={{ width: "auto" }} />
        <textarea rows={2} value={text} onChange={e => setText(e.target.value)} placeholder={`What did you do?`} className="inp" />
        <div style={{ display: "flex", flexWrap: "wrap", marginBottom: 12 }}>
          {categories.map(c => <Tag key={c.n} label={c.n} sel={cat === c.n} onClick={() => setCat(c.n)} bg={c.bg} tx={c.tx} br={c.br} />)}
        </div>
        <Dur h={h} m={m} sh={setH} sm={setM} />
        <button onClick={add} className="pbtn" style={{ background: "#1C1C1E" }}>+ Save Activity</button>
      </div>
      {[...entries].reverse().map(e => {
        const c = categories.find(x => x.n === e.cat);
        return (
          <div key={e.id} className="card" style={{ borderLeft: "4px solid " + (c?.br || "#5E5CE6") }}>
            <button className="dbtn" onClick={() => setEntries(entries.filter(x => x.id !== e.id))}>×</button>
            <span style={{ fontSize: 11, fontWeight: 700, color: c?.tx || "#5E5CE6" }}>{e.cat}</span>
            <div style={{ fontSize: 15, marginTop: 10 }}>{e.text}</div>
            <div style={{ fontSize: 12, color: "#8E8E93", marginTop: 8 }}>{e.date && <span style={{marginRight: 6}}>{e.date}</span>}{e.time} · {Math.floor(e.mins/60)}h {e.mins%60}m</div>
          </div>
        );
      })}
      {entries.length > 0 && <AIBtn label={`Analyze Daily Alignment`} prompt={`Review this day log:\n${log}\n\nTotal: ${Math.floor(total/60)}h ${total%60}m\n\nGive: 1)Identity statement 2)Time lost 3)Wins 4)Priority alignment 5)3 improvements for tomorrow 6)CEO mantra`} sessionKey={sessionKey} />}
    </div>
  );
}

function Finance({ sessionKey }){
  const [expenses,setExpenses]=useSecureStorage("fin_exp", [], sessionKey); 
  const [invs,setInvs]=useSecureStorage("fin_inv", [], sessionKey);
  const [expStr]=useSecureStorage("sys_exp","Food & Groceries, Transport, Bills & Utilities, Medicine, Family, Tithe, Emergency, Other", sessionKey);
  const [invStr]=useSecureStorage("sys_inv","Skill (course/book), Health investment, Tool/Equipment, Savings, Other", sessionKey);
  
  const [tab,setTab]=useState("exp");
  const [ed,setEd]=useState(""); const [ea,setEa]=useState(""); const [ec,setEc]=useState(null);
  const [id,setId]=useState(""); const [ia,setIa]=useState(""); const [ic,setIc]=useState(null);

  const ECATS = expStr.split(",").map(s=>s.trim()).filter(x=>x);
  const ICATS = invStr.split(",").map(s=>s.trim()).filter(x=>x);

  const te = expenses.reduce((s,e)=>s+parseFloat(e.a||0),0); 
  const ti = invs.reduce((s,e)=>s+parseFloat(e.a||0),0);
  
  function addE(){if(!ed||!ea||!ec)return alert("Fill all fields");setExpenses([...expenses,{id:Date.now(),d:ed,a:ea,c:ec,date:fmtDate()}]);setEd("");setEa("");setEc(null);}
  function addI(){if(!id||!ia||!ic)return alert("Fill all fields");setInvs([...invs,{id:Date.now(),d:id,a:ia,c:ic,date:fmtDate()}]);setId("");setIa("");setIc(null);}
  
  const sum="Expenses (Rs."+te.toFixed(0)+"):\n"+expenses.map(e=>"- "+e.c+": "+e.d+" Rs."+e.a).join("\n")+"\nInvestments (Rs."+ti.toFixed(0)+"):\n"+invs.map(e=>"- "+e.c+": "+e.d+" Rs."+e.a).join("\n");

  return <div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:18}}>
      <div className="card" style={{textAlign:"center", background:"#FF3B30", color:"#FFFFFF", border:"none"}}>
        <div style={{fontSize:24, fontFamily:"'Outfit',sans-serif", fontWeight:800}}>Rs.{te.toFixed(0)}</div>
        <div style={{fontSize:11, marginTop:4, opacity: 0.9}}>SPENT TODAY</div>
      </div>
      <div className="card" style={{textAlign:"center", background:"#34C759", color:"#FFFFFF", border:"none"}}>
        <div style={{fontSize:24, fontFamily:"'Outfit',sans-serif", fontWeight:800}}>Rs.{ti.toFixed(0)}</div>
        <div style={{fontSize:11, marginTop:4, opacity: 0.9}}>INVESTED TODAY</div>
      </div>
    </div>

    <div style={{display:"flex",gap:8,marginBottom:14}}>
      <button onClick={()=>setTab("exp")} className="pbtn" style={{flex:1, background:tab==="exp"?"#1C1C1E":"#F2F2F7", color:tab==="exp"?"#FFF":"#8E8E93", marginTop:0}}>Expense</button>
      <button onClick={()=>setTab("inv")} className="pbtn" style={{flex:1, background:tab==="inv"?"#1C1C1E":"#F2F2F7", color:tab==="inv"?"#FFF":"#8E8E93", marginTop:0}}>Investment</button>
    </div>

    <div className="card">
      <span className="lbl">Category</span>
      <div style={{display:"flex",flexWrap:"wrap",marginBottom:12}}>
        {tab==="exp" ? ECATS.map(c=><Tag key={c} label={c} sel={ec===c} onClick={()=>setEc(c)}/>) : ICATS.map(c=><Tag key={c} label={c} sel={ic===c} onClick={()=>setIc(c)} bg="#EAF3DE" tx="#27500A" br="#639922"/>)}
      </div>
      <span className="lbl">Description</span>
      <input value={tab==="exp"?ed:id} onChange={e=>tab==="exp"?setEd(e.target.value):setId(e.target.value)} placeholder="e.g. DMart groceries" className="inp"/>
      <span className="lbl">Amount (Rs.)</span>
      <input type="number" value={tab==="exp"?ea:ia} onChange={e=>tab==="exp"?setEa(e.target.value):setIa(e.target.value)} placeholder="0" className="inp" style={{width:140}}/>
      <button onClick={tab==="exp"?addE:addI} className="pbtn" style={{background:tab==="exp"?"#FF3B30":"#34C759"}}>+ Add {tab==="exp"?"expense":"investment"}</button>
    </div>

    <div className="card">
      <span className="lbl">History</span>
      {(tab==="exp"?expenses:invs).map(e=>(
        <div key={e.id} style={{display:"flex", justifyContent:"space-between", alignItems: "center", padding:"10px 0", borderBottom:"1px solid #F2F2F7"}}>
          <div><div style={{fontSize:14, fontWeight:500}}>{e.d}</div><div style={{fontSize:11, color:"#8E8E93", marginTop: 4}}>{e.c} {e.date && `· ${e.date}`}</div></div>
          <div style={{fontWeight:800, color: tab==="exp"?"#FF3B30":"#34C759"}}>₹{e.a} <button onClick={()=>{tab==="exp"?setExpenses(expenses.filter(x=>x.id!==e.id)):setInvs(invs.filter(x=>x.id!==e.id))}} className="dbtn" style={{float:"none", marginLeft:10}}>×</button></div>
        </div>
      ))}
    </div>
    <AIBtn label="Financial Audit" prompt={`Analyse today finances:\n${sum}\n\nGive: 1)Spending pattern 2)Alignment with cash-flow freedom 3)One thing to cut 4)Tip for tomorrow 5)Motivational framing`} sessionKey={sessionKey} />
  </div>;
}

function Gym({ sessionKey }){
  const [gymStr]=useSecureStorage("sys_gym","Push, Pull, Legs, Core, Cardio, Full body, Yoga/Mobility, Rest day", sessionKey);
  const MUSCLES = gymStr.split(",").map(s=>s.trim()).filter(x=>x);
  
  const [muscle,setMuscle]=useSecureStorage("gym_muscle", null, sessionKey);
  const [energy,setEnergy]=useSecureStorage("gym_energy", null, sessionKey);
  const [exs,setExs]=useSecureStorage("gym_exs", [], sessionKey);
  const [notes,setNotes]=useSecureStorage("gym_notes", "", sessionKey);
  const [h,setH]=useSecureStorage("gym_h", 0, sessionKey); 
  const [m,setM]=useSecureStorage("gym_m", 45, sessionKey);

  const [en,setEn]=useState(""); const [es,setEs]=useState(""); const [er,setEr]=useState(""); const [ew,setEw]=useState("");
  
  function addEx(){if(!en.trim())return;setExs([...exs,{id:Date.now(),n:en,s:es,r:er,w:ew,date:fmtDate()}]);setEn("");setEs("");setEr("");setEw("");}
  
  const sum="Muscle: "+(muscle||"?")+" | Energy: "+(energy||"?")+" | Duration: "+h+"h "+m+"m\nExercises:\n"+exs.map(e=>"- "+e.n+": "+e.s+" sets x "+e.r+" reps @ "+e.w+"kg").join("\n")+"\nNotes: "+(notes||"none");

  return <div>
    <div className="card">
      <span className="lbl">Muscle group</span>
      <div style={{display:"flex",flexWrap:"wrap",marginBottom:12}}>{MUSCLES.map(g=><Tag key={g} label={g} sel={muscle===g} onClick={()=>setMuscle(g)} bg="#EAF3DE" tx="#27500A" br="#639922"/>)}</div>
      <span className="lbl">Energy</span>
      <div style={{display:"flex",gap:8,marginBottom:12}}>{["High","Medium","Low"].map(e=><button key={e} onClick={()=>setEnergy(e)} style={{flex:1,padding:"10px 0",borderRadius:12,border:energy===e?"2px solid #639922":"1.5px solid #E5E5EA",background:energy===e?"#EAF3DE":"#F2F2F7",color:energy===e?"#27500A":"#8E8E93",fontSize:13,cursor:"pointer",fontWeight:energy===e?700:500}}>{e}</button>)}</div>
      <span className="lbl">Duration</span>
      <Dur h={h} m={m} sh={setH} sm={setM}/>
    </div>
    <div className="card">
      <span className="lbl">Log exercise</span>

    )}

    <div className="tab-content" key={tab}>
      {allTabs.map(t => (
        <div key={t.id} style={{display: tab === t.id ? "block" : "none"}}>
          {t.id === "activity" ? <Activity sessionKey={sessionKey} /> :
           t.id === "finance" ? <Finance sessionKey={sessionKey} /> :
           t.id === "gym" ? <Gym sessionKey={sessionKey} /> :
           t.id === "skills" ? <Skills sessionKey={sessionKey} /> :
           t.id === "spiritual" ? <Spiritual sessionKey={sessionKey} /> :
           t.id === "prophecy" ? <Prophecy sessionKey={sessionKey} /> :
           t.id === "settings" ? <Settings sessionKey={sessionKey} /> :
           <GenericLogger sectionId={t.id} title={t.label} icon={t.icon} tagsStr={t.tags} sessionKey={sessionKey} />}
        </div>
      ))}
    </div>

    <div className="nav">
      {navTabs.map(t => (
        <button key={t.id} className="nb" onClick={() => handleNav(t.id)}>
          <span style={{fontSize: t.id==="more"?16:22, color: (tab===t.id||(t.id==="more"&&showMore)) ? "#5E5CE6" : "#C7C7CC"}}>{t.icon}</span>
          <span style={{fontSize:10, fontWeight:700, color:(tab===t.id||(t.id==="more"&&showMore))?"#5E5CE6":"#C7C7CC"}}>{t.label}</span>
        </button>
      ))}
    </div>
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
