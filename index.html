<div id="root"></div>
<script type="text/babel" data-presets="react">
const {useState, useEffect} = React;
const fmtDate = () => new Date().toLocaleDateString("en-IN",{weekday:"short",day:"numeric",month:"short",year:"numeric"});

// --- 1. STORAGE ENGINES ---
function useSecureStorage(key, init, secretKey) {
  const [val, setVal] = useState(() => {
    try {
      const encryptedData = window.localStorage.getItem(key);
      if (encryptedData !== null) {
        if (secretKey) {
          const bytes = CryptoJS.AES.decrypt(encryptedData, secretKey);
          const decrypted = bytes.toString(CryptoJS.enc.Utf8);
          return JSON.parse(decrypted);
        }
        return init; 
      }
      return init;
    } catch(e) { return init; }
  });

  useEffect(() => {
    const handleStorage = (e) => {
      if (e.detail && e.detail.key === key) setVal(e.detail.val);
    };
    window.addEventListener("local-storage-sync", handleStorage);
    return () => window.removeEventListener("local-storage-sync", handleStorage);
  }, [key]);

  const save = (v) => {
    setVal(v);
    try { 
      if (secretKey) {
        const encrypted = CryptoJS.AES.encrypt(JSON.stringify(v), secretKey).toString();
        window.localStorage.setItem(key, encrypted); 
      }
    } catch(e) {}
    window.dispatchEvent(new CustomEvent("local-storage-sync", { detail: { key, val: v } }));
  };
  return [val, save];
}

function useLocalStorage(key, init) {
  const [val, setVal] = useState(() => {
    try {
      const x = window.localStorage.getItem(key);
      return x !== null ? JSON.parse(x) : init;
    } catch(e) { return init; }
  });

  useEffect(() => {
    const handleStorage = (e) => {
      if (e.detail && e.detail.key === key) setVal(e.detail.val);
    };
    window.addEventListener("local-storage-sync", handleStorage);
    return () => window.removeEventListener("local-storage-sync", handleStorage);
  }, [key]);

  const save = (v) => {
    setVal(v);
    try { window.localStorage.setItem(key, JSON.stringify(v)); } catch(e) {}
    window.dispatchEvent(new CustomEvent("local-storage-sync", { detail: { key, val: v } }));
  };
  return [val, save];
}

// --- STOPWATCH HOOK ---
function useStopwatch(sectionId, sessionKey) {
  const [startTime, setStartTime] = useSecureStorage(`sw_start_${sectionId}`, null, sessionKey);
  const [elapsed, setElapsed] = useState("00:00:00");
  useEffect(() => {
    let interval;
    if (startTime) {
      interval = setInterval(() => {
        const diff = Date.now() - startTime;
        const hh = Math.floor(diff / 3600000);
        const mm = Math.floor((diff % 3600000) / 60000);
        const ss = Math.floor((diff % 60000) / 1000);
        setElapsed(`${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}:${String(ss).padStart(2,'0')}`);
      }, 1000);
    } else { setElapsed("00:00:00"); }
    return () => clearInterval(interval);
  }, [startTime]);
  return { startTime, setStartTime, elapsed };
}

const PALETTE=[
  {bg:"#EEF0FF",tx:"#5E5CE6",br:"#5E5CE6"},{bg:"#EAF3DE",tx:"#27500A",br:"#639922"},
  {bg:"#FAEEDA",tx:"#633806",br:"#EF9F27"},{bg:"#FBEAF0",tx:"#72243E",br:"#D4537E"},
  {bg:"#E6F1FB",tx:"#0C447C",br:"#378ADD"},{bg:"#E8E6E0",tx:"#2C2C2A",br:"#B4B2A9"}
];

function Tag({label,sel,onClick,bg,tx,br}){
  return <button className="tbtn" onClick={onClick} style={{background:sel?(bg||"#EEF0FF"):"transparent",color:sel?(tx||"#5E5CE6"):"#8E8E93",border:sel?"1.5px solid "+(br||"#5E5CE6"):"1px solid #E5E5EA",fontWeight:sel?700:400}}>{label}</button>;
}

function Dur({h,m,sh,sm}){
  return <div style={{display:"flex",gap:10,alignItems:"center"}}>
    <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:4}}>
      <span style={{fontSize:10,color:"#8E8E93",fontWeight:700,letterSpacing:1}}>HOURS</span>
      <div style={{display:"flex",alignItems:"center",gap:4}}>
        <button className="sbtn" onClick={()=>sh(Math.max(0,h-1))}>-</button>
        <span style={{fontSize:22,fontWeight:700,minWidth:28,textAlign:"center",fontFamily:"'Outfit',sans-serif"}}>{h}</span>
        <button className="sbtn" onClick={()=>sh(Math.min(12,h+1))}>+</button>
      </div>
    </div>
    <span style={{fontSize:24,color:"#C7C7CC",marginTop:16,fontFamily:"'Outfit',sans-serif"}}>:</span>
    <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:4}}>
      <span style={{fontSize:10,color:"#8E8E93",fontWeight:700,letterSpacing:1}}>MINS</span>
      <div style={{display:"flex",alignItems:"center",gap:4}}>
        <button className="sbtn" onClick={()=>sm(Math.max(0,m-5))}>-</button>
        <span style={{fontSize:22,fontWeight:700,minWidth:28,textAlign:"center",fontFamily:"'Outfit',sans-serif"}}>{m}</span>
        <button className="sbtn" onClick={()=>sm(Math.min(55,m+5))}>+</button>
      </div>
    </div>
  </div>;
}

// --- CLOCK COMPONENT ---
function CurrentTime() {
  const [time, setTime] = useState(new Date());
  useEffect(() => {
    const timer = setInterval(() => setTime(new Date()), 1000);
    return () => clearInterval(timer);
  }, []);
  return (
    <div style={{fontSize: 12, color: "#8E8E93", fontWeight: 700, marginBottom: 12, display: "flex", alignItems: "center", gap: 6}}>
      <span style={{fontSize: 16}}>⌚</span> {time.toLocaleTimeString('en-US', {hour: '2-digit', minute:'2-digit', second:'2-digit'})}
    </div>
  );
}

// --- 2. AI BUTTON COMPONENT ---
function AIBtn({prompt, label, sessionKey}){
  const [load, setLoad] = useState(false);
  const [res, setRes] = useState("");
  const [apiKey, setApiKey] = useSecureStorage("gemini_api_key", "", sessionKey);
  const [identity] = useSecureStorage("sys_ctx", "", sessionKey);

  async function run(){
    let currentKey = apiKey;
    if(!currentKey){
      currentKey = window.prompt("James, please enter your Gemini API Key:");
      if(!currentKey) return; 
      setApiKey(currentKey);
    }
    setLoad(true); setRes("");
    try{
      const r = await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key="+currentKey,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({ contents: [{ parts: [{ text: `ABOUT ME:\n${identity}\n\nDATA:\n${prompt}` }] }] })
      });
      const d = await r.json();
      if(d.error) { setRes("API Error: "+d.error.message); setApiKey(""); }
      else { setRes(d.candidates[0].content.parts[0].text); }
    } catch(e) { setRes("Network Error."); }
    setLoad(false);
  }
  return <div style={{marginTop: 16}}>
    <button onClick={run} disabled={load} className="pbtn" style={{background: load ? "#C7C7CC" : "#1C1C1E", marginTop: 0}}>
      {load ? "Processing..." : "✦ " + label}
    </button>
    {res && <div className="ai-output">{res}</div>}
  </div>;
}

// --- TAB COMPONENTS ---
function Activity({ sessionKey }) {
  const [entries, setEntries] = useSecureStorage("entries_activity", [], sessionKey);
  const [actStr] = useSecureStorage("sys_act", "Prayer & Bible, Gym & fitness, Deep work, Office work, Study (AI/PMP), Finance action, Family time, Meals, Commute, Distraction, Rest, Other", sessionKey);
  const [text, setText] = useState("");
  const [cat, setCat] = useState(null);
  const [h, setH] = useState(0);
  const [m, setM] = useState(30);
  const [time, setTime] = useState(() => {
    const n = new Date();
    return String(n.getHours()).padStart(2, "0") + ":" + String(n.getMinutes()).padStart(2, "0");
  });
  
  const { startTime, setStartTime, elapsed } = useStopwatch("activity", sessionKey);

  const categories = actStr.split(",").map((t, i) => ({ n: t.trim(), ...PALETTE[i % PALETTE.length] })).filter(x => x.n);

  function add(overrideMins = null) {
    if (!text.trim() || !cat) {
      alert("Fill entry and category");
      return false;
    }
    const totalMins = overrideMins !== null ? overrideMins : (h * 60 + m);
    setEntries([...entries, { id: Date.now(), text, cat, mins: totalMins, time, date: fmtDate() }]);
    setText(""); setCat(null); setH(0); setM(30);
    return true;
  }

  // Helper to safely convert text times (like "45s" or "1m 10s") into pure minutes for the daily total
  const parseTime = (val) => {
    if (!val) return 0;
    if (typeof val === 'number') return val;
    const s = String(val);
    let t = 0;
    if (s.includes('h')) { const m = s.match(/(\d+)h/); if(m) t += parseInt(m[1])*60; }
    if (s.includes('m')) { const m = s.match(/(\d+)m/); if(m) t += parseInt(m[1]); }
    if (s.includes('s') && !s.includes('m') && !s.includes('h')) t += 1; // Pure seconds round up to 1m for daily summary
    if (!s.includes('h') && !s.includes('m') && !s.includes('s')) t += parseInt(s) || 0; 
    return t;
  };

  const dailyTotals = entries.reduce((acc, e) => {
     if(!acc[e.date]) acc[e.date] = { count: 0, mins: 0 };
     acc[e.date].count += 1;
     acc[e.date].mins += parseTime(e.mins || e.time);
     return acc;
  }, {});

  const log = entries.map(e => `${e.time} | ${e.cat} | ${e.mins} | ${e.text}`).join("\n");

  return (
    <div>
      <div className="card">
        <h3 style={{marginBottom: 10}}>◎ Activity Log</h3>
        <CurrentTime />
        <textarea rows={2} value={text} onChange={e => setText(e.target.value)} placeholder="What did you do?" className="inp" />
        <div style={{ display: "flex", flexWrap: "wrap", marginBottom: 12 }}>
          {categories.map(c => <Tag key={c.n} label={c.n} sel={cat === c.n} onClick={() => setCat(c.n)} bg={c.bg} tx={c.tx} br={c.br} />)}
        </div>
        
        <div style={{display:"flex", gap:16, alignItems:"center", justifyContent:"space-between", marginBottom: 12}}>
          <Dur h={h} m={m} sh={setH} sm={setM} />
          <button onClick={() => {
            if (!startTime) { 
               // VALIDATION CHECK BEFORE STARTING
               if (!text.trim() || !cat) {
                 alert("Please enter what you did and select a category before starting the clock.");
                 return;
               }
               setStartTime(Date.now()); 
            } 
            else {
              // PASS SECONDS INSTEAD OF MINUTES
              const diffSeconds = Math.floor((Date.now() - startTime) / 1000);
              if (add(diffSeconds)) { setStartTime(null); }
            }
          }} className="pbtn" style={{width:"auto", padding:"10px 16px", borderRadius:14, background: startTime ? "#FF3B30" : "#1C1C1E", margin:0, fontFamily:"monospace"}}>
            {startTime ? `⏹ ${elapsed}` : "Start Clock"}
          </button>
        </div>

        <button onClick={()=>add()} className="pbtn" style={{ background: "#1C1C1E", opacity: startTime ? 0.3 : 1 }}>+ Save</button>
      </div>
      {[...entries].reverse().map((e, i, arr) => {
        // Only show the header if it's the first item, or if the date changes from the previous card
        const showHeader = i === 0 || arr[i - 1].date !== e.date;
        const dayStats = dailyTotals[e.date];
        const dh = Math.floor(dayStats.mins / 60);
        const dm = dayStats.mins % 60;
        
        return (
          <div key={e.id}>
            {showHeader && (
              <div style={{fontSize: 11, color: "#8E8E93", fontWeight: 800, margin: "24px 0 8px 4px", textTransform: "uppercase", letterSpacing: 0.5}}>
                {e.date} &nbsp;·&nbsp; {dayStats.count} ENTRIES &nbsp;·&nbsp; ⏱ {dh > 0 ? `${dh}h ` : ""}{dm}m
              </div>
            )}
            <div className="card" style={{ borderLeft: "4px solid #5E5CE6", marginBottom: 12 }}>
              <button className="dbtn" onClick={() => setEntries(entries.filter(x => x.id !== e.id))}>×</button>
              <span style={{ fontSize: 11, fontWeight: 700 }}>{e.cat}</span>
              <div style={{ fontSize: 15, marginTop: 6 }}>{e.text}</div>
              <div style={{ fontSize: 12, color: "#8E8E93", marginTop: 8 }}>{e.time} · {e.mins}</div>
            </div>
          </div>
        );
      })}
      <AIBtn label="Daily Review" prompt={`Analyze my day:\n${log}`} sessionKey={sessionKey} />
    </div>
  );
}

function Finance({ sessionKey }){
  const [expenses,setExpenses]=useSecureStorage("fin_exp", [], sessionKey); 
  const [invs,setInvs]=useSecureStorage("fin_inv", [], sessionKey);
  const [expStr]=useSecureStorage("sys_exp","Food & Groceries, Transport, Bills & Utilities, Medicine, Family, Tithe, Emergency, Other", sessionKey);
  const [invStr]=useSecureStorage("sys_inv","Skill (course/book), Health investment, Tool/Equipment, Savings, Other", sessionKey);
  const [tab,setTab]=useState("exp");
  const [ed,setEd]=useState(""); const [ea,setEa]=useState(""); const [ec,setEc]=useState(null);
  const [id,setId]=useState(""); const [ia,setIa]=useState(""); const [ic,setIc]=useState(null);
  const te = expenses.reduce((s,e)=>s+parseFloat(e.a||0),0); 
  const ti = invs.reduce((s,e)=>s+parseFloat(e.a||0),0);
  
  function addE(){if(!ed||!ea||!ec)return alert("Fill fields");setExpenses([...expenses,{id:Date.now(),d:ed,a:ea,c:ec,date:fmtDate()}]);setEd("");setEa("");setEc(null);}
  function addI(){if(!id||!ia||!ic)return alert("Fill fields");setInvs([...invs,{id:Date.now(),d:id,a:ia,c:ic,date:fmtDate()}]);setId("");setIa("");setIc(null);}
  
  const log = `Spent: ${te}\nInvested: ${ti}\nExpenses: ${expenses.map(e=>e.d+": "+e.a).join(",")}\nInvestments: ${invs.map(e=>e.d+": "+e.a).join(",")}`;

  return <div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:18}}>
      <div className="card" style={{background:"#FF3B30", color:"#FFF", textAlign:"center"}}>
        <div style={{fontSize:24, fontWeight:800}}>Rs.{te.toFixed(0)}</div>
        <div style={{fontSize:11}}>SPENT</div>
      </div>
      <div className="card" style={{background:"#34C759", color:"#FFF", textAlign:"center"}}>
        <div style={{fontSize:24, fontWeight:800}}>Rs.{ti.toFixed(0)}</div>
        <div style={{fontSize:11}}>INVESTED</div>
      </div>
    </div>
    <div style={{display:"flex",gap:8,marginBottom:14}}>
      <button onClick={()=>setTab("exp")} className="pbtn" style={{flex:1, background:tab==="exp"?"#1C1C1E":"#F2F2F7", color:tab==="exp"?"#FFF":"#8E8E93", marginTop:0}}>Expense</button>
      <button onClick={()=>setTab("inv")} className="pbtn" style={{flex:1, background:tab==="inv"?"#1C1C1E":"#F2F2F7", color:tab==="inv"?"#FFF":"#8E8E93", marginTop:0}}>Investment</button>
    </div>
    <div className="card">
      <CurrentTime />
      <span className="lbl">Category</span>
      <div style={{display:"flex",flexWrap:"wrap",marginBottom:12}}>{(tab==="exp"?expStr:invStr).split(",").map(c=><Tag key={c} label={c.trim()} sel={(tab==="exp"?ec:ic)===c.trim()} onClick={()=>(tab==="exp"?setEc(c.trim()):setIc(c.trim()))}/>)}</div>
      <input value={tab==="exp"?ed:id} onChange={e=>tab==="exp"?setEd(e.target.value):setId(e.target.value)} placeholder="Description..." className="inp"/>
      <input type="number" value={tab==="exp"?ea:ia} onChange={e=>tab==="exp"?setEa(e.target.value):setIa(e.target.value)} placeholder="Amount..." className="inp"/>
      <button onClick={tab==="exp"?addE:addI} className="pbtn" style={{background:tab==="exp"?"#FF3B30":"#34C759"}}>Add</button>
    </div>
    {(tab==="exp"?expenses:invs).map(e=>(
      <div key={e.id} className="card" style={{display:"flex", justifyContent:"space-between", alignItems:"center"}}>
        <div><div style={{fontSize:14, fontWeight:500}}>{e.d}</div><div style={{fontSize:11, color:"#8E8E93"}}>{e.c} · {e.date}</div></div>
        <div style={{fontWeight:800, color:tab==="exp"?"#FF3B30":"#34C759"}}>₹{e.a} <button onClick={()=>tab==="exp"?setExpenses(expenses.filter(x=>x.id!==e.id)):setInvs(invs.filter(x=>x.id!==e.id))} className="dbtn">×</button></div>
      </div>
    ))}
    <AIBtn label="Financial Audit" prompt={log} sessionKey={sessionKey} />
  </div>;
}

function Gym({ sessionKey }){
  const [gymStr]=useSecureStorage("sys_gym","Push, Pull, Legs, Core, Cardio, Full body, Yoga, Rest", sessionKey);
  const [muscle,setMuscle]=useSecureStorage("gym_muscle", null, sessionKey);
  const [exs,setExs]=useSecureStorage("gym_exs", [], sessionKey);
  const [h,setH]=useSecureStorage("gym_h", 0, sessionKey); 
  const [m,setM]=useSecureStorage("gym_m", 45, sessionKey);
  const [en,setEn]=useState(""); const [es,setEs]=useState(""); const [er,setEr]=useState(""); const [ew,setEw]=useState("");
  
  const { startTime, setStartTime, elapsed } = useStopwatch("gym", sessionKey);

  // Updated to accept exact time from stopwatch, or fallback to manual time
  function addEx(exactTime = null){
    if(!muscle) return alert("Please select a Target muscle group.");
    if(!en.trim()) return alert("Please enter an Exercise Name.");

function CustomTabLogger({ tab, sessionKey }) {
  const [entries, setEntries] = useSecureStorage(`entries_${tab.id}`, [], sessionKey);
  const [text, setText] = useState("");
  const [cat, setCat] = useState(null);
  const [h, setH] = useState(0);
  const [m, setM] = useState(30);
  const [time, setTime] = useState(() => {
    const n = new Date();
    return String(n.getHours()).padStart(2, "0") + ":" + String(n.getMinutes()).padStart(2, "0");
  });
  
  const { startTime, setStartTime, elapsed } = useStopwatch(tab.id, sessionKey);

  const categories = (tab.tags || "General").split(",").map((t, i) => ({ n: t.trim(), ...PALETTE[i % PALETTE.length] })).filter(x => x.n);

  function add(overrideMins = null) {
    if (!text.trim() || !cat) {
      alert("Fill entry and category");
      return false;
    }
    const totalMins = overrideMins !== null ? overrideMins : (h * 60 + m);
    setEntries([...entries, { id: Date.now(), text, cat, mins: totalMins, time, date: fmtDate() }]);
    setText(""); setCat(null); setH(0); setM(30);
    return true;
  }

  // Helper to safely convert text times (like "45s" or "1m 10s") into pure minutes for the daily total
  const parseTime = (val) => {
    if (!val) return 0;
    if (typeof val === 'number') return val;
    const s = String(val);
    let t = 0;
    if (s.includes('h')) { const m = s.match(/(\d+)h/); if(m) t += parseInt(m[1])*60; }
    if (s.includes('m')) { const m = s.match(/(\d+)m/); if(m) t += parseInt(m[1]); }
    if (s.includes('s') && !s.includes('m') && !s.includes('h')) t += 1; // Pure seconds round up to 1m for daily summary
    if (!s.includes('h') && !s.includes('m') && !s.includes('s')) t += parseInt(s) || 0; 
    return t;
  };

  const dailyTotals = entries.reduce((acc, e) => {
     if(!acc[e.date]) acc[e.date] = { count: 0, mins: 0 };
     acc[e.date].count += 1;
     acc[e.date].mins += parseTime(e.mins || e.time);
     return acc;
  }, {});

  const log = entries.map(e => `${e.time} | ${e.cat} | ${e.mins} | ${e.text}`).join("\n");

  return (
    <div>
      <div className="card">
        <h3 style={{marginBottom: 10}}>{tab.icon} {tab.label}</h3>
        <CurrentTime />
        <textarea rows={2} value={text} onChange={e => setText(e.target.value)} placeholder={`Log ${tab.label}...`} className="inp" />
        <div style={{ display: "flex", flexWrap: "wrap", marginBottom: 12 }}>
          {categories.map(c => <Tag key={c.n} label={c.n} sel={cat === c.n} onClick={() => setCat(c.n)} bg={c.bg} tx={c.tx} br={c.br} />)}
        </div>
        
        <div style={{display:"flex", gap:16, alignItems:"center", justifyContent:"space-between", marginBottom: 12}}>
          <Dur h={h} m={m} sh={setH} sm={setM} />
          <button onClick={() => {
            if (!startTime) { 
              if (!text.trim() || !cat) {
                alert("Please enter a description and select a category first.");
                return;
              }
              setStartTime(Date.now()); 
            } 
            else {
              const diffSecs = Math.floor((Date.now() - startTime) / 1000);
              if(add(diffSecs)) { setStartTime(null); }
            }
          }} className="pbtn" style={{width:"auto", padding:"10px 16px", borderRadius:14, background: startTime ? "#FF3B30" : "#1C1C1E", margin:0, fontFamily:"monospace"}}>
            {startTime ? `⏹ ${elapsed}` : "Start Clock"}
          </button>
        </div>

        <button onClick={()=>add()} className="pbtn" style={{ background: "#1C1C1E", opacity: startTime ? 0.3 : 1 }}>+ Save</button>
      </div>
      {[...entries].reverse().map((e, i, arr) => {
        // Only show the header if it's the first item, or if the date changes from the previous card
        const showHeader = i === 0 || arr[i - 1].date !== e.date;
        const dayStats = dailyTotals[e.date];
        const dh = Math.floor(dayStats.mins / 60);
        const dm = dayStats.mins % 60;
        
        return (
          <div key={e.id}>
            {showHeader && (
              <div style={{fontSize: 11, color: "#8E8E93", fontWeight: 800, margin: "24px 0 8px 4px", textTransform: "uppercase", letterSpacing: 0.5}}>
                {e.date} &nbsp;·&nbsp; {dayStats.count} ENTRIES &nbsp;·&nbsp; ⏱ {dh > 0 ? `${dh}h ` : ""}{dm}m
              </div>
            )}
            <div className="card" style={{ borderLeft: "4px solid #5E5CE6", marginBottom: 12 }}>
              <button className="dbtn" onClick={() => setEntries(entries.filter(x => x.id !== e.id))}>×</button>
              <span style={{ fontSize: 11, fontWeight: 700 }}>{e.cat}</span>
              <div style={{ fontSize: 15, marginTop: 6 }}>{e.text}</div>
              <div style={{ fontSize: 12, color: "#8E8E93", marginTop: 8 }}>{e.time} · {e.mins}</div>
            </div>
          </div>
        );
      })}
      <AIBtn label="Daily Review" prompt={`Analyze my day:\n${log}`} sessionKey={sessionKey} />
    </div>
  );
}

function App(){
  const VALID_HASHES = ["06010538dc6f364bd7d2a9a1f707d97a2894bb00216482d75effffa6c2a1570e"]; //FOR KRISHNA-270493
  const [sessionKey, setSessionKey] = useState(sessionStorage.getItem("active_key") || null);
  const [pinAttempt, setPinAttempt] = useState("");

  const [showMore, setShowMore] = useState(false);
  const [customTabs] = useLocalStorage("custom_tabs", []);

  const handleUnlock = () => { if (CryptoJS.SHA256(pinAttempt.trim()).toString() === VALID_HASHES[0]) { setSessionKey(pinAttempt.trim()); sessionStorage.setItem("active_key", pinAttempt.trim()); } else { alert("Error"); setPinAttempt(""); } };
  
  if (!sessionKey) return <div style={{maxWidth: 520, margin: "0 auto", height: "100vh", display: "flex", flexDirection: "column", justifyContent: "center", padding: 20}}><div className="card" style={{textAlign: "center"}}><div style={{fontSize: 50}}>🛡️</div><h2>James Chronicles</h2><input type="password" value={pinAttempt} onChange={e=>setPinAttempt(e.target.value)} placeholder="PIN..." className="inp" style={{textAlign:"center", marginTop:12}}/><button onClick={handleUnlock} className="pbtn">Unlock</button></div></div>;
  
  const h = new Date().getHours();
  const greeting = h < 12 ? "Good morning" : h < 17 ? "Good afternoon" : "Good evening";

  return <div style={{maxWidth: 520, margin: "0 auto", padding: "40px 20px 100px"}}>
    <h4 style={{fontSize:12, color:"#5E5CE6", letterSpacing:2}}>JAMES CHRONICLES</h4>
    <h1 style={{fontSize:34}}>{greeting}, James.</h1>
    <div style={{marginTop: 20}}>
      {tab === "activity" && <Activity sessionKey={sessionKey}/>}
      {tab === "finance" && <Finance sessionKey={sessionKey}/>}
      {tab === "gym" && <Gym sessionKey={sessionKey}/>}
      {tab === "skills" && <Skills sessionKey={sessionKey}/>}
      {tab === "spiritual" && <Spiritual sessionKey={sessionKey}/>}
      {tab === "prophecy" && <Prophecy sessionKey={sessionKey}/>}
      {tab === "settings" && <Settings sessionKey={sessionKey}/>}
      {customTabs.map(t => tab === t.id && <CustomTabLogger key={t.id} tab={t} sessionKey={sessionKey}/>)}
    </div>

   {showMore && (
      <div style={{position:"fixed", bottom:90, left:"50%", transform:"translateX(-50%)", width:"calc(100% - 40px)", maxWidth:480, background:"#fff", borderRadius:24, padding:16, boxShadow:"0 -4px 30px rgba(0,0,0,0.12)", zIndex:800, display:"flex", flexWrap:"wrap", gap:8}}>
        <button onClick={()=>{setTab("finance"); setShowMore(false);}} style={{flex:"1 1 48%", padding:"14px 8px", borderRadius:16, background:"#F2F2F7", border:"none", fontWeight:700}}>₹ Ledger</button>
        <button onClick={()=>{setTab("gym"); setShowMore(false);}} style={{flex:"1 1 48%", padding:"14px 8px", borderRadius:16, background:"#F2F2F7", border:"none", fontWeight:700}}>◈ Gym</button>
        <button onClick={()=>{setTab("skills"); setShowMore(false);}} style={{flex:"1 1 48%", padding:"14px 8px", borderRadius:16, background:"#F2F2F7", border:"none", fontWeight:700}}>◑ Skill</button>
        <button onClick={()=>{setTab("spiritual"); setShowMore(false);}} style={{flex:"1 1 48%", padding:"14px 8px", borderRadius:16, background:"#F2F2F7", border:"none", fontWeight:700}}>✦ Spirit</button>
        <button onClick={()=>{setTab("prophecy"); setShowMore(false);}} style={{flex:"1 1 48%", padding:"14px 8px", borderRadius:16, background:"#F2F2F7", border:"none", fontWeight:700}}>🎬 Future</button>
        {customTabs.map(t => <button key={t.id} onClick={()=>{setTab(t.id); setShowMore(false);}} style={{flex:"1 1 48%", padding:"14px 8px", borderRadius:16, background:"#F2F2F7", border:"none", fontWeight:700}}>{t.icon} {t.label}</button>)}
      </div>
    )}

    <div className="nav">
      <button className="nb" onClick={()=>{setTab("activity"); setShowMore(false);}}><span style={{fontSize:22, color:tab==="activity"?"#5E5CE6":"#C7C7CC"}}>◎</span><span style={{fontSize:10, color:tab==="activity"?"#5E5CE6":"#C7C7CC"}}>Log</span></button>
      <button className="nb" onClick={()=>setShowMore(!showMore)}><span style={{fontSize:22, color:showMore?"#5E5CE6":"#C7C7CC"}}>••••</span><span style={{fontSize:10, color:showMore?"#5E5CE6":"#C7C7CC"}}>More</span></button>
      <button className="nb" onClick={()=>{setTab("settings"); setShowMore(false);}}><span style={{fontSize:22, color:tab==="settings"?"#5E5CE6":"#C7C7CC"}}>⚙</span><span style={{fontSize:10, color:tab==="settings"?"#5E5CE6":"#C7C7CC"}}>Config</span></button>
    </div>
  </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
