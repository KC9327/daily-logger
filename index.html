<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>James Chronicles</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#F2F2F7">
<link rel="apple-touch-icon" href="./icon.png">

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Outfit:wght@400;600;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Inter',-apple-system,sans-serif;background:#F2F2F7;padding-bottom:100px;color:#1C1C1E;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;}
.card{background:#FFFFFF;border-radius:24px;padding:20px;margin-bottom:16px;box-shadow:0 8px 24px rgba(0,0,0,0.04);}
h1,h2,h3{font-family:'Outfit',sans-serif;font-weight:800;letter-spacing:-0.02em;}
.lbl{font-size:11px;color:#8E8E93;letter-spacing:0.05em;text-transform:uppercase;margin-bottom:8px;display:block;font-weight:700;}
.inp{width:100%;padding:14px;border:none;border-radius:16px;font-size:16px;background:#F2F2F7;outline:none;margin-bottom:12px;}
.pbtn{width:100%;padding:16px;color:#FFFFFF;border:none;border-radius:18px;font-size:15px;font-family:'Outfit',sans-serif;font-weight:700;cursor:pointer;margin-top:8px;background:#5E5CE6;box-shadow:0 4px 12px rgba(94,92,230,0.3);}
.tbtn{padding:10px 18px;border-radius:14px;font-size:14px;background:#F2F2F7;color:#3A3A3C;margin:4px 4px 4px 0;border:1px solid #E5E5EA;cursor:pointer;}
.sbtn{width:36px;height:36px;border-radius:12px;border:none;background:#F2F2F7;cursor:pointer;font-size:20px;font-weight:700;color:#5E5CE6;}
.nav{position:fixed;bottom:20px;left:20px;right:20px;background:rgba(255,255,255,0.9);backdrop-filter:blur(10px);border-radius:28px;display:flex;padding:12px 10px;box-shadow:0 10px 30px rgba(0,0,0,0.1);z-index:900;}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;background:none;border:none;cursor:pointer;}
.dbtn{float:right;background:none;border:none;color:#C7C7CC;font-size:18px;cursor:pointer;}
.ai-output{background:#F8F9FA;border:1.5px solid #5E5CE6;border-radius:16px;padding:16px;margin-top:16px;font-size:14px;line-height:1.6;white-space:pre-wrap;}
.timer-btn{background:#1C1C1E;color:#FFF;border:none;padding:10px 16px;border-radius:14px;font-weight:700;font-family:monospace;cursor:pointer;display:flex;align-items:center;gap:6px;}
@keyframes fadeIn{from{opacity:0;transform:scale(0.98);}to{opacity:1;transform:scale(1);}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const {useState, useEffect} = React;
const fmtDate = () => new Date().toLocaleDateString("en-IN",{weekday:"short",day:"numeric",month:"short",year:"numeric"});

function useSecureStorage(key, init, secretKey) {
  const [val, setVal] = useState(() => {
    try {
      const encryptedData = window.localStorage.getItem(key);
      if (encryptedData !== null && secretKey) {
        const bytes = CryptoJS.AES.decrypt(encryptedData, secretKey);
        return JSON.parse(bytes.toString(CryptoJS.enc.Utf8));
      }
      return init;
    } catch(e) { return init; }
  });
  const save = (v) => {
    setVal(v);
    if (secretKey) {
      const encrypted = CryptoJS.AES.encrypt(JSON.stringify(v), secretKey).toString();
      window.localStorage.setItem(key, encrypted);
    }
  };
  return [val, save];
}

function useLocalStorage(key, init) {
  const [val, setVal] = useState(() => {
    try {
      const x = window.localStorage.getItem(key);
      return x !== null ? JSON.parse(x) : init;
    } catch(e) { return init; }
  });
  const save = (v) => { setVal(v); window.localStorage.setItem(key, JSON.stringify(v)); };
  return [val, save];
}

const PALETTE=[{bg:"#EEF0FF",tx:"#5E5CE6",br:"#5E5CE6"},{bg:"#EAF3DE",tx:"#27500A",br:"#639922"},{bg:"#FAEEDA",tx:"#633806",br:"#EF9F27"},{bg:"#FBEAF0",tx:"#72243E",br:"#D4537E"},{bg:"#E6F1FB",tx:"#0C447C",br:"#378ADD"},{bg:"#E8E6E0",tx:"#2C2C2A",br:"#B4B2A9"}];

function Tag({label,sel,onClick,bg,tx,br}){return <button className="tbtn" onClick={onClick} style={{background:sel?(bg||"#EEF0FF"):"transparent",color:sel?(tx||"#5E5CE6"):"#8E8E93",border:sel?"1.5px solid "+(br||"#5E5CE6"):"1px solid #E5E5EA",fontWeight:sel?700:400}}>{label}</button>;}

function AIBtn({prompt, label, sessionKey}){
  const [load, setLoad] = useState(false);
  const [res, setRes] = useState("");
  const [apiKey] = useSecureStorage("gemini_api_key", "", sessionKey);
  const [identity] = useSecureStorage("sys_ctx", "", sessionKey);
  async function run(){
    if(!apiKey) return alert("Gemini Key Required");
    setLoad(true); setRes("");
    try{
      const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({contents:[{parts:[{text:`ADVISOR:\n${identity}\n\nDATA:\n${prompt}`}]}]})
      });
      const d = await r.json();
      setRes(d.candidates[0].content.parts[0].text);
    } catch(e) { setRes("Connection Error."); }
    setLoad(false);
  }
  return <div style={{marginTop: 16}}><button onClick={run} disabled={load} className="pbtn" style={{background: load ? "#C7C7CC" : "#1C1C1E", marginTop:0}}>{load ? "Strategizing..." : "✦ " + label}</button>{res && <div className="ai-output">{res}</div>}</div>;
}

function GenericLogger({ sectionId, title, icon, tagsStr, sessionKey }) {
  const [entries, setEntries] = useSecureStorage(`entries_${sectionId}`, [], sessionKey);
  const [startTime, setStartTime] = useSecureStorage(`sw_start_${sectionId}`, null, sessionKey);
  const [text, setText] = useState("");
  const [cat, setCat] = useState(null);
  const [h, setH] = useState(0);
  const [m, setM] = useState(30);
  const [elapsed, setElapsed] = useState("00:00:00");

  useEffect(() => {
    let interval;
    if (startTime) {
      interval = setInterval(() => {
        const diff = Date.now() - startTime;
        const hh = Math.floor(diff / 3600000);
        const mm = Math.floor((diff % 3600000) / 60000);
        const ss = Math.floor((diff % 60000) / 1000);
        setElapsed(`${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}:${String(ss).padStart(2,'0')}`);
      }, 1000);
    }
    return () => clearInterval(interval);
  }, [startTime]);

  const categories = (tagsStr || "").split(",").map((t, i) => ({ n: t.trim(), ...PALETTE[i % PALETTE.length] })).filter(x => x.n);

  function saveEntry(finalMins = null) {
    if (!text.trim() || !cat) return alert("Fill entry and category");
    const totalMins = finalMins !== null ? finalMins : (h * 60 + m);
    setEntries([...entries, { id: Date.now(), text, cat, mins: totalMins, date: fmtDate(), time: new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) }]);
    setText(""); setCat(null); setH(0); setM(30); setStartTime(null);
  }

  const toggleClock = () => {
    if (!startTime) { setStartTime(Date.now()); } 
    else {
      const diffMins = Math.floor((Date.now() - startTime) / 60000);
      saveEntry(diffMins);
    }
  };

  const log = entries.map(e => `${e.cat} | ${e.mins}m | ${e.text}`).join("\n");

  return (
    <div>
      <div className="card">
        <h3 style={{marginBottom: 10}}>{icon} {title}</h3>
        <textarea rows={2} value={text} onChange={e => setText(e.target.value)} placeholder={`Log ${title}...`} className="inp" />
        <div style={{ display: "flex", flexWrap: "wrap", marginBottom: 12 }}>
          {categories.map(c => <Tag key={c.n} label={c.n} sel={cat === c.n} onClick={() => setCat(c.n)} bg={c.bg} tx={c.tx} br={c.br} />)}
        </div>
        <div style={{display:"flex", gap:16, alignItems:"center", justifyContent:"space-between"}}>
          <div style={{display:"flex", gap:12, alignItems:"center"}}>
            <div style={{textAlign:"center"}}><span className="lbl" style={{marginBottom:4}}>H</span><div style={{display:"flex",alignItems:"center",gap:6}}><button className="sbtn" onClick={()=>setH(Math.max(0,h-1))}>-</button><span style={{fontWeight:700, minWidth:20}}>{h}</span><button className="sbtn" onClick={()=>setH(h+1)}>+</button></div></div>
            <span style={{fontSize:20, color:"#C7C7CC", marginTop:14}}>:</span>
            <div style={{textAlign:"center"}}><span className="lbl" style={{marginBottom:4}}>M</span><div style={{display:"flex",alignItems:"center",gap:6}}><button className="sbtn" onClick={()=>setM(Math.max(0,m-5))}>-</button><span style={{fontWeight:700, minWidth:20}}>{m}</span><button className="sbtn" onClick={()=>setM(m+5)}>+</button></div></div>
          </div>
          <button onClick={toggleClock} className="timer-btn" style={{background: startTime ? "#FF3B30" : "#1C1C1E"}}>
            {startTime ? <span>⏹ {elapsed}</span> : "Start Clock"}
          </button>
        </div>
        <button onClick={()=>saveEntry()} className="pbtn" style={{background:"#1C1C1E", opacity: startTime ? 0.3 : 1}}>+ Save Entry</button>
      </div>
      {[...entries].reverse().map(e => (
        <div key={e.id} className="card" style={{ borderLeft: "4px solid #5E5CE6" }}>
          <button className="dbtn" onClick={() => setEntries(entries.filter(x => x.id !== e.id))}>×</button>
          <span style={{ fontSize: 11, fontWeight: 700 }}>{e.cat}</span>
          <div style={{ fontSize: 15, marginTop: 6 }}>{e.text}</div>
          <div style={{ fontSize: 12, color: "#8E8E93", marginTop: 8 }}>{e.date} · {e.mins}m</div>
        </div>
      ))}
      <AIBtn label={`${title} Audit`} prompt={log} sessionKey={sessionKey} />
    </div>
  );
}

function Finance({ sessionKey }){
  const [expenses,setExpenses]=useSecureStorage("fin_exp", [], sessionKey); 
  const [invs,setInvs]=useSecureStorage("fin_inv", [], sessionKey);
  const [expStr]=useSecureStorage("sys_exp","Tithe, Interest, Rent, Groceries, DWCRA, Utilities, Other", sessionKey);
  const [invStr]=useSecureStorage("sys_inv","AI Skills, PMP, Health, Corpus, Other", sessionKey);
  const [tab,setTab]=useState("exp");
  const [ed,setEd]=useState(""); const [ea,setEa]=useState(""); const [ec,setEc]=useState(null);
  const [id,setId]=useState(""); const [ia,setIa]=useState(""); const [ic,setIc]=useState(null);
  function addE(){if(!ed||!ea||!ec)return alert("Fill all fields");setExpenses([...expenses,{id:Date.now(),d:ed,a:ea,c:ec,date:fmtDate()}]);setEd("");setEa("");setEc(null);}
  function addI(){if(!id||!ia||!ic)return alert("Fill all fields");setInvs([...invs,{id:Date.now(),d:id,a:ia,c:ic,date:fmtDate()}]);setId("");setIa("");setIc(null);}
  return <div>
    <div style={{display:"flex",gap:8,marginBottom:14}}>
      <button onClick={()=>setTab("exp")} className="pbtn" style={{flex:1, background:tab==="exp"?"#1C1C1E":"#F2F2F7", color:tab==="exp"?"#FFF":"#8E8E93", marginTop:0}}>Expense</button>
      <button onClick={()=>setTab("inv")} className="pbtn" style={{flex:1, background:tab==="inv"?"#1C1C1E":"#F2F2F7", color:tab==="inv"?"#FFF":"#8E8E93", marginTop:0}}>Investment</button>
    </div>
    <div className="card">
      <span className="lbl">Category</span>
      <div style={{display:"flex",flexWrap:"wrap",marginBottom:12}}>{(tab==="exp"?expStr:invStr).split(",").map(c=><Tag key={c} label={c.trim()} sel={(tab==="exp"?ec:ic)===c.trim()} onClick={()=>(tab==="exp"?setEc(c.trim()):setIc(c.trim()))}/>)}</div>
      <input value={tab==="exp"?ed:id} onChange={e=>tab==="exp"?setEd(e.target.value):setId(e.target.value)} placeholder="Description..." className="inp"/>
      <input type="number" value={tab==="exp"?ea:ia} onChange={e=>tab==="exp"?setEa(e.target.value):setIa(e.target.value)} placeholder="Amount..." className="inp"/>
      <button onClick={tab==="exp"?addE:addI} className="pbtn" style={{background:tab==="exp"?"#FF3B30":"#34C759"}}>+ Add</button>
    </div>
    {(tab==="exp"?expenses:invs).map(e=>(
      <div key={e.id} className="card" style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}><div style={{fontSize:14}}>{e.d} <span style={{fontSize:10,color:"#8E8E93"}}>{e.c}</span></div><div style={{fontWeight:800}}>₹{e.a} <button onClick={()=>tab==="exp"?setExpenses(expenses.filter(x=>x.id!==e.id)):setInvs(invs.filter(x=>x.id!==e.id))} className="dbtn">×</button></div></div>
    ))}
  </div>;
}

function Spiritual({ sessionKey }) {
  const [spiritStr]=useSecureStorage("sys_spirit","Bible, Morning Prayer, Evening Prayer, Other", sessionKey);
  const [types,setTypes]=useSecureStorage("sp_types", [], sessionKey);
  const [verse,setVerse]=useSecureStorage("sp_verse", "", sessionKey);
  const [godSpoke,setGodSpoke]=useSecureStorage("sp_godSpoke", "", sessionKey);
  return <div>
    <div className="card"><span className="lbl">Actions</span><div style={{display:"flex",flexWrap:"wrap",marginBottom:12}}>{spiritStr.split(",").map(t=><Tag key={t} label={t.trim()} sel={types.includes(t.trim())} onClick={()=>setTypes(types.includes(t.trim())?types.filter(x=>x!==t.trim()):[...types,t.trim()])}/>)}</div><span className="lbl">Verse</span><input value={verse} onChange={e=>setVerse(e.target.value)} placeholder="Proverbs..." className="inp"/><span className="lbl">Reflection</span><textarea rows={3} value={godSpoke} onChange={e=>setGodSpoke(e.target.value)} placeholder="Insights..." className="inp"/></div>
    <AIBtn label="Spiritual Counsel" prompt={`Verse: ${verse}\nNotes: ${godSpoke}`} sessionKey={sessionKey} />
  </div>;
}

function Settings({ sessionKey }){
  const [apiKey, setApiKey] = useSecureStorage("gemini_api_key", "", sessionKey);
  const [sysCtx, setSysCtx] = useSecureStorage("sys_ctx", "Assistant for James.", sessionKey);
  const [sysAct, setSysAct] = useSecureStorage("sys_act", "Prayer, Work, Gym, Study, Finance, Other", sessionKey);
  const [sysExp, setSysExp] = useSecureStorage("sys_exp", "Tithe, Interest, Rent, Other", sessionKey);
  const [sysSpirit, setSysSpirit] = useSecureStorage("sys_spirit", "Bible, Prayer, Other", sessionKey);
  const [customTabs, setCustomTabs] = useLocalStorage("custom_tabs", []);
  const [draftCustom, setDraftCustom] = useState(Array.isArray(customTabs) ? customTabs : []);
  const save = () => { setApiKey(apiKey); setSysCtx(sysCtx); setSysAct(sysAct); setSysExp(sysExp); setSysSpirit(sysSpirit); alert("Saved!"); };
  const exportData = () => { const d = {}; for(let i=0; i<localStorage.length; i++){ d[localStorage.key(i)]=localStorage.getItem(localStorage.key(i)); } const b=new Blob([JSON.stringify(d)],{type:"application/json"}); const u=URL.createObjectURL(b); const a=document.createElement("a"); a.href=u; a.download="James_Backup.json"; a.click(); };
  return <div>
    <div className="card"><h3>Configuration</h3><span className="lbl">Gemini Key</span><input type="password" value={apiKey} onChange={e=>setApiKey(e.target.value)} className="inp"/><span className="lbl">Advisor</span><textarea rows={3} value={sysCtx} onChange={e=>setSysCtx(e.target.value)} className="inp"/><span className="lbl">Journal Tags</span><input value={sysAct} onChange={e=>setSysAct(e.target.value)} className="inp"/><button onClick={save} className="pbtn">Save</button></div>
    <div className="card"><h3>Custom Slots</h3>{draftCustom.map((t, i) => (<div key={t.id} style={{marginBottom:12, padding:10, background:"#F2F2F7", borderRadius:12}}><div style={{display:"flex", gap:8}}><input value={t.icon} onChange={e=>{const n=[...draftCustom]; n[i].icon=e.target.value; setDraftCustom(n);}} className="inp" style={{width:50}}/><input value={t.label} onChange={e=>{const n=[...draftCustom]; n[i].label=e.target.value; setDraftCustom(n);}} className="inp"/><button onClick={()=>setDraftCustom(draftCustom.filter(x=>x.id!==t.id))} className="dbtn">×</button></div><input value={t.tags||""} onChange={e=>{const n=[...draftCustom]; n[i].tags=e.target.value; setDraftCustom(n);}} className="inp" placeholder="Tags..."/></div>))}<button onClick={()=>setDraftCustom([...draftCustom, {id:"tab_"+Date.now(), icon:"📝", label:"New Tab", tags:"Other"}])} className="pbtn" style={{background:"transparent", color:"#5E5CE6", border:"1px solid #5E5CE6"}}>+ Add Tab</button><button onClick={()=>{setCustomTabs(draftCustom); alert("Saved!");}} className="pbtn" style={{marginTop:10}}>Save Layout</button></div>
    <div className="card"><button onClick={exportData} className="pbtn">Export Backup</button><button onClick={()=>{if(window.confirm("Reset?")){localStorage.clear(); window.location.reload();}}} className="pbtn" style={{background:"#FF3B30", marginTop:10}}>Reset App</button></div>
  </div>;
}

function App(){
  const VALID_HASHES = ["1e61cbd265f6a005bf508beb003e921619fb4ac6624fd22ac37eda10ea640ca4"];
  const [sessionKey, setSessionKey] = useState(sessionStorage.getItem("active_key") || null);
  const [pinAttempt, setPinAttempt] = useState("");
  const [tab, setTab] = useState("activity");
  const [showMore, setShowMore] = useState(false);
  const [customTabs] = useLocalStorage("custom_tabs", []);
  if (!sessionKey) return <div style={{maxWidth:520,margin:"0 auto",height:"100vh",display:"flex",flexDirection:"column",justifyContent:"center",padding:20}}><div className="card" style={{textAlign:"center"}}><div style={{fontSize:50}}>🛡️</div><h2>James Chronicles</h2><input type="password" value={pinAttempt} onChange={e=>setPinAttempt(e.target.value)} placeholder="PIN..." className="inp" style={{textAlign:"center",marginTop:12}}/><button onClick={()=>{if(CryptoJS.SHA256(pinAttempt.trim()).toString()===VALID_HASHES[0]){setSessionKey(pinAttempt.trim());sessionStorage.setItem("active_key",pinAttempt.trim());}else{alert("Denied");setPinAttempt("");}}} className="pbtn">Unlock</button></div></div>;
  return <div style={{maxWidth:520,margin:"0 auto",padding:"40px 20px 100px"}}>
    <h1 style={{fontSize:34, marginBottom:20}}>James Chronicles</h1>
    <div>
      {tab === "activity" && <Activity sessionKey={sessionKey}/>}
      {tab === "finance" && <Finance sessionKey={sessionKey}/>}
      {tab === "gym" && <GenericLogger sectionId="gym" title="Gym" icon="◈" tagsStr={localStorage.getItem("sys_gym")||"Push,Pull,Legs,Other"} sessionKey={sessionKey}/>}
      {tab === "spiritual" && <Spiritual sessionKey={sessionKey}/>}
      {tab === "settings" && <Settings sessionKey={sessionKey}/>}
      {customTabs.map(t => tab === t.id && <GenericLogger key={t.id} sectionId={t.id} title={t.label} icon={t.icon} tagsStr={t.tags} sessionKey={sessionKey}/>)}
    </div>
    {showMore && <div style={{position:"fixed",bottom:90,left:"50%",transform:"translateX(-50%)",width:"calc(100% - 40px)",maxWidth:480,background:"#fff",borderRadius:24,padding:16,boxShadow:"0 -4px 30px rgba(0,0,0,0.12)",zIndex:800,display:"flex",flexWrap:"wrap",gap:8}}>{customTabs.map(t => <button key={t.id} onClick={()=>{setTab(t.id);setShowMore(false);}} style={{flex:"1 1 48%",padding:14,borderRadius:16,background:"#F2F2F7",border:"none"}}>{t.icon} {t.label}</button>)}</div>}
    <div className="nav">
      {[["activity","◎","Log"],["finance","₹","Ledger"],["gym","◈","Gym"],["spiritual","✦","Spirit"]].map(([id,icon,label])=>(<button key={id} className="nb" onClick={()=>{setTab(id);setShowMore(false);}}><span style={{fontSize:22,color:tab===id?"#5E5CE6":"#C7C7CC"}}>{icon}</span><span style={{fontSize:10,color:tab===id?"#5E5CE6":"#C7C7CC"}}>{label}</span></button>))}
      <button className="nb" onClick={()=>setShowMore(!showMore)}><span style={{fontSize:22,color:showMore?"#5E5CE6":"#C7C7CC"}}>••••</span><span style={{fontSize:10,color:showMore?"#5E5CE6":"#C7C7CC"}}>More</span></button>
      <button className="nb" onClick={()=>{setTab("settings");setShowMore(false);}}><span style={{fontSize:22,color:tab==="settings"?"#5E5CE6":"#C7C7CC"}}>⚙</span><span style={{fontSize:10,color:tab==="settings"?"#5E5CE6":"#C7C7CC"}}>Config</span></button>
    </div>
  </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
