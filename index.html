<script type="text/babel" data-presets="react">
const {useState, useEffect} = React;
const fmtDate = () => new Date().toLocaleDateString("en-IN",{weekday:"short",day:"numeric",month:"short",year:"numeric"});

// --- 1. STORAGE ENGINES ---
function useSecureStorage(key, init, secretKey) {
  const [val, setVal] = useState(() => {
    try {
      const encryptedData = window.localStorage.getItem(key);
      if (encryptedData !== null) {
        if (secretKey) {
          const bytes = CryptoJS.AES.decrypt(encryptedData, secretKey);
          const decrypted = bytes.toString(CryptoJS.enc.Utf8);
          return JSON.parse(decrypted);
        }
        return init; 
      }
      return init;
    } catch(e) { return init; }
  });

  useEffect(() => {
    const handleStorage = (e) => {
      if (e.detail && e.detail.key === key) setVal(e.detail.val);
    };
    window.addEventListener("local-storage-sync", handleStorage);
    return () => window.removeEventListener("local-storage-sync", handleStorage);
  }, [key]);

  const save = (v) => {
    setVal(v);
    try { 
      if (secretKey) {
        const encrypted = CryptoJS.AES.encrypt(JSON.stringify(v), secretKey).toString();
        window.localStorage.setItem(key, encrypted); 
      }
    } catch(e) {}
    window.dispatchEvent(new CustomEvent("local-storage-sync", { detail: { key, val: v } }));
  };
  return [val, save];
}

function useLocalStorage(key, init) {
  const [val, setVal] = useState(() => {
    try {
      const x = window.localStorage.getItem(key);
      return x !== null ? JSON.parse(x) : init;
    } catch(e) { return init; }
  });

  useEffect(() => {
    const handleStorage = (e) => {
      if (e.detail && e.detail.key === key) setVal(e.detail.val);
    };
    window.addEventListener("local-storage-sync", handleStorage);
    return () => window.removeEventListener("local-storage-sync", handleStorage);
  }, [key]);

  const save = (v) => {
    setVal(v);
    try { window.localStorage.setItem(key, JSON.stringify(v)); } catch(e) {}
    window.dispatchEvent(new CustomEvent("local-storage-sync", { detail: { key, val: v } }));
  };
  return [val, save];
}

const PALETTE=[
  {bg:"#EEF0FF",tx:"#5E5CE6",br:"#5E5CE6"},{bg:"#EAF3DE",tx:"#27500A",br:"#639922"},
  {bg:"#FAEEDA",tx:"#633806",br:"#EF9F27"},{bg:"#FBEAF0",tx:"#72243E",br:"#D4537E"},
  {bg:"#E6F1FB",tx:"#0C447C",br:"#378ADD"},{bg:"#E8E6E0",tx:"#2C2C2A",br:"#B4B2A9"}
];

function Tag({label,sel,onClick,bg,tx,br}){
  return <button className="tbtn" onClick={onClick} style={{background:sel?(bg||"#EEF0FF"):"transparent",color:sel?(tx||"#5E5CE6"):"#8E8E93",border:sel?"1.5px solid "+(br||"#5E5CE6"):"1px solid #E5E5EA",fontWeight:sel?700:400}}>{label}</button>;
}

function Dur({h,m,sh,sm}){
  return <div style={{display:"flex",gap:16,alignItems:"center"}}>
    <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:6}}>
      <span style={{fontSize:10,color:"#8E8E93",fontWeight:700,letterSpacing:1}}>HOURS</span>
      <div style={{display:"flex",alignItems:"center",gap:8}}>
        <button className="sbtn" onClick={()=>sh(Math.max(0,h-1))}>-</button>
        <span style={{fontSize:22,fontWeight:700,minWidth:32,textAlign:"center",fontFamily:"'Outfit',sans-serif"}}>{h}</span>
        <button className="sbtn" onClick={()=>sh(Math.min(12,h+1))}>+</button>
      </div>
    </div>
    <span style={{fontSize:24,color:"#C7C7CC",marginTop:18,fontFamily:"'Outfit',sans-serif"}}>:</span>
    <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:6}}>
      <span style={{fontSize:10,color:"#8E8E93",fontWeight:700,letterSpacing:1}}>MINS</span>
      <div style={{display:"flex",alignItems:"center",gap:8}}>
        <button className="sbtn" onClick={()=>sm(Math.max(0,m-5))}>-</button>
        <span style={{fontSize:22,fontWeight:700,minWidth:32,textAlign:"center",fontFamily:"'Outfit',sans-serif"}}>{m}</span>
        <button className="sbtn" onClick={()=>sm(Math.min(55,m+5))}>+</button>
      </div>
    </div>
  </div>;
}

// --- 2. AI BUTTON COMPONENT ---
function AIBtn({prompt, label, sessionKey}){
  const [load, setLoad] = useState(false);
  const [res, setRes] = useState("");
  const [apiKey, setApiKey] = useSecureStorage("gemini_api_key", "", sessionKey);
  const [identity] = useSecureStorage("sys_ctx", "", sessionKey);

  async function run(){
    let currentKey = apiKey;
    if(!currentKey){
      currentKey = window.prompt("James, please enter your Gemini API Key:");
      if(!currentKey) return; 
      setApiKey(currentKey);
    }
    setLoad(true); setRes("");
    try{
      const r = await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key="+currentKey,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({ contents: [{ parts: [{ text: `CONTEXT:\n${identity}\n\nDATA TO ANALYZE:\n${prompt}` }] }] })
      });
      const d = await r.json();
      if(d.error) { setRes("API Error: "+d.error.message); setApiKey(""); }
      else { setRes(d.candidates[0].content.parts[0].text); }
    } catch(e) { setRes("Network Error."); }
    setLoad(false);
  }
  return <div style={{marginTop: 16}}>
    <button onClick={run} disabled={load} className="pbtn" style={{background: load ? "#C7C7CC" : "#1C1C1E", marginTop: 0}}>
      {load ? "Processing..." : "✦ " + label}
    </button>
    {res && <div className="ai-output">{res}</div>}
  </div>;
}

// --- 3. CORE LOGGER (Used by Custom Tabs) ---
function GenericLogger({ sectionId, title, icon, tagsStr, sessionKey }) {
  const [entries, setEntries] = useSecureStorage(`entries_${sectionId}`, [], sessionKey);
  const [text, setText] = useState("");
  const [cat, setCat] = useState(null);
  const [h, setH] = useState(0);
  const [m, setM] = useState(30);
  const [time, setTime] = useState(() => {
    const n = new Date();
    return String(n.getHours()).padStart(2, "0") + ":" + String(n.getMinutes()).padStart(2, "0");
  });

  const categories = (tagsStr || "").split(",").map((t, i) => ({ n: t.trim(), ...PALETTE[i % PALETTE.length] })).filter(x => x.n);

  function add() {
    if (!text.trim() || !cat) return alert("Fill entry and category");
    setEntries([...entries, { id: Date.now(), text, cat, mins: h * 60 + m, time, date: fmtDate() }]);
    setText(""); setCat(null); setH(0); setM(30);
  }

  const total = entries.reduce((s, e) => s + e.mins, 0);
  const log = entries.map(e => `${e.time} | ${e.cat} | ${e.mins}m | ${e.text}`).join("\n");

  return (
    <div>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginBottom: 18 }}>
        <div style={{ background: "#232528", borderRadius: 16, padding: 16, color: "#F8F7F2", textAlign: "center" }}>
          <div style={{ fontSize: 28, fontWeight: 800 }}>{entries.length}</div>
          <div style={{ fontSize: 11, color: "#C4BEAD", marginTop: 4 }}>ENTRIES</div>
        </div>
        <div style={{ background: "#232528", borderRadius: 16, padding: 16, color: "#F8F7F2", textAlign: "center" }}>
          <div style={{ fontSize: 24, fontWeight: 800 }}>{Math.floor(total / 60)}h {total % 60}m</div>
          <div style={{ fontSize: 11, color: "#C4BEAD", marginTop: 4 }}>TRACKED</div>
        </div>
      </div>
      <div className="card">
        <h3 style={{marginBottom: 10}}>{icon} {title}</h3>
        <textarea rows={2} value={text} onChange={e => setText(e.target.value)} placeholder={`Log ${title}...`} className="inp" />
        <div style={{ display: "flex", flexWrap: "wrap", marginBottom: 12 }}>
          {categories.map(c => <Tag key={c.n} label={c.n} sel={cat === c.n} onClick={() => setCat(c.n)} bg={c.bg} tx={c.tx} br={c.br} />)}
        </div>
        <Dur h={h} m={m} sh={setH} sm={setM} />
        <button onClick={add} className="pbtn" style={{ background: "#1C1C1E" }}>+ Save to {title}</button>
      </div>
      {[...entries].reverse().map(e => {
        const c = categories.find(x => x.n === e.cat);
        return (
          <div key={e.id} className="card" style={{ borderLeft: "4px solid " + (c?.br || "#5E5CE6") }}>
            <button className="dbtn" onClick={() => setEntries(entries.filter(x => x.id !== e.id))}>×</button>
            <span style={{ fontSize: 11, fontWeight: 700 }}>{e.cat}</span>
            <div style={{ fontSize: 15, marginTop: 10 }}>{e.text}</div>
            <div style={{ fontSize: 12, color: "#8E8E93", marginTop: 8 }}>{e.date} · {e.time} · {e.mins}m</div>
          </div>
        );
      })}
      <AIBtn label={`${title} Analysis`} prompt={log} sessionKey={sessionKey} />
    </div>
  );
}

// --- 4. BUILT-IN SECTIONS ---

  return (

function Finance({ sessionKey }){
  const [expenses,setExpenses]=useSecureStorage("fin_exp", [], sessionKey); 
  const [invs,setInvs]=useSecureStorage("fin_inv", [], sessionKey);
  const [expStr]=useSecureStorage("sys_exp","Tithe, Interest, Rent, Groceries, Medicine, DWCRA, Utilities, Services, Other", sessionKey);
  const [invStr]=useSecureStorage("sys_inv","Skill Growth, PMP Training, Health, Savings, Corpus, Other", sessionKey);
  const [tab,setTab]=useState("exp");
  const [ed,setEd]=useState(""); const [ea,setEa]=useState(""); const [ec,setEc]=useState(null);
  const [id,setId]=useState(""); const [ia,setIa]=useState(""); const [ic,setIc]=useState(null);
  const te = expenses.reduce((s,e)=>s+parseFloat(e.a||0),0); 
  const ti = invs.reduce((s,e)=>s+parseFloat(e.a||0),0);
  function addE(){if(!ed||!ea||!ec)return alert("Fill all fields");setExpenses([...expenses,{id:Date.now(),d:ed,a:ea,c:ec,date:fmtDate()}]);setEd("");setEa("");setEc(null);}
  function addI(){if(!id||!ia||!ic)return alert("Fill all fields");setInvs([...invs,{id:Date.now(),d:id,a:ia,c:ic,date:fmtDate()}]);setId("");setIa("");setIc(null);}
  const log = "Expenses:\n"+expenses.map(e=>`- ${e.c}: ₹${e.a}`).join("\n") + "\nInvestments:\n"+invs.map(e=>`- ${e.c}: ₹${e.a}`).join("\n");
  return <div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:18}}>
      <div className="card" style={{background:"#FF3B30", color:"#FFF", textAlign:"center"}}>
        <div style={{fontSize:24, fontWeight:800}}>Rs.{te.toFixed(0)}</div>
        <div style={{fontSize:11}}>SPENT</div>
      </div>
      <div className="card" style={{background:"#34C759", color:"#FFF", textAlign:"center"}}>
        <div style={{fontSize:24, fontWeight:800}}>Rs.{ti.toFixed(0)}</div>
        <div style={{fontSize:11}}>INVESTED</div>
      </div>
    </div>
    <div style={{display:"flex",gap:8,marginBottom:14}}>
      <button onClick={()=>setTab("exp")} className="pbtn" style={{flex:1, background:tab==="exp"?"#1C1C1E":"#F2F2F7", color:tab==="exp"?"#FFF":"#8E8E93", marginTop:0}}>Expense</button>
      <button onClick={()=>setTab("inv")} className="pbtn" style={{flex:1, background:tab==="inv"?"#1C1C1E":"#F2F2F7", color:tab==="inv"?"#FFF":"#8E8E93", marginTop:0}}>Investment</button>
    </div>
    <div className="card">
      <span className="lbl">Category</span>
      <div style={{display:"flex",flexWrap:"wrap",marginBottom:12}}>{(tab==="exp"?expStr:invStr).split(",").map(c=><Tag key={c} label={c.trim()} sel={(tab==="exp"?ec:ic)===c.trim()} onClick={()=>(tab==="exp"?setEc(c.trim()):setIc(c.trim()))}/>)}</div>
      <input value={tab==="exp"?ed:id} onChange={e=>tab==="exp"?setEd(e.target.value):setId(e.target.value)} placeholder="Description..." className="inp"/>
      <input type="number" value={tab==="exp"?ea:ia} onChange={e=>tab==="exp"?setEa(e.target.value):setIa(e.target.value)} placeholder="Amount..." className="inp"/>
      <button onClick={tab==="exp"?addE:addI} className="pbtn" style={{background:tab==="exp"?"#FF3B30":"#34C759"}}>+ Add</button>
    </div>
    {(tab==="exp"?expenses:invs).map(e=>(
      <div key={e.id} className="card" style={{display:"flex", justifyContent:"space-between", alignItems:"center"}}>
        <div><div style={{fontSize:14, fontWeight:500}}>{e.d}</div><div style={{fontSize:11, color:"#8E8E93"}}>{e.c} · {e.date}</div></div>
        <div style={{fontWeight:800, color:tab==="exp"?"#FF3B30":"#34C759"}}>₹{e.a} <button onClick={()=>tab==="exp"?setExpenses(expenses.filter(x=>x.id!==e.id)):setInvs(invs.filter(x=>x.id!==e.id))} className="dbtn">×</button></div>
      </div>
    ))}
    <AIBtn label="Financial Audit" prompt={log} sessionKey={sessionKey} />
  </div>;
}

function Spiritual({ sessionKey }) {
  const [spiritStr]=useSecureStorage("sys_spirit","Bible Reading, Morning Prayer, Evening Prayer, Reflection, Fasting, Other", sessionKey);
  const [types,setTypes]=useSecureStorage("sp_types", [], sessionKey);
  const [verse,setVerse]=useSecureStorage("sp_verse", "", sessionKey);
  const [godSpoke,setGodSpoke]=useSecureStorage("sp_godSpoke", "", sessionKey);
  const [h,setH]=useSecureStorage("sp_h", 0, sessionKey); 
  const [m,setM]=useSecureStorage("sp_m", 30, sessionKey);
  function toggle(t){setTypes(types.includes(t)?types.filter(x=>x!==t):[...types,t]);}
  return <div>
    <div className="card">
      <span className="lbl">Actions</span>
      <div style={{display:"flex",flexWrap:"wrap",marginBottom:12}}>{spiritStr.split(",").map(t=><Tag key={t} label={t.trim()} sel={types.includes(t.trim())} onClick={()=>toggle(t.trim())}/>)}</div>
      <Dur h={h} m={m} sh={setH} sm={setM}/>
      <span className="lbl">Daily Verse</span>
      <input value={verse} onChange={e=>setVerse(e.target.value)} placeholder="e.g. Proverbs 13:11..." className="inp"/>
      <span className="lbl">What God spoke to me</span>
      <textarea rows={3} value={godSpoke} onChange={e=>setGodSpoke(e.target.value)} placeholder="Insights..." className="inp"/>
    </div>
    <AIBtn label="Spiritual Counsel" prompt={`Reflection:\nVerse: ${verse}\nNotes: ${godSpoke}`} sessionKey={sessionKey} />
  </div>;
}

function Settings({ sessionKey }){
  const [apiKey, setApiKey] = useSecureStorage("gemini_api_key", "", sessionKey);
  const [sysCtx, setSysCtx] = useSecureStorage("sys_ctx", "You are James' Strategic Advisor.", sessionKey);
  const [sysAct, setSysAct] = useSecureStorage("sys_act", "Prayer, Gym, Work, Study, Finance, Other", sessionKey);
  const [sysExp, setSysExp] = useSecureStorage("sys_exp", "Tithe, Interest, Rent, Other", sessionKey);
  const [sysInv, setSysInv] = useSecureStorage("sys_inv", "Skills, corpus, Other", sessionKey);
  const [sysGym, setSysGym] = useSecureStorage("sys_gym", "Push, Pull, Legs, Core, Cardio, Yoga, Rest", sessionKey);
  const [sysSkill, setSysSkill] = useSecureStorage("sys_skill", "AI, PMP, Other", sessionKey);
  const [sysSpirit, setSysSpirit] = useSecureStorage("sys_spirit", "Bible, Prayer, Fasting, Other", sessionKey);
  const [draftApi, setDraftApi] = useState(apiKey);
  const [draftCtx, setDraftCtx] = useState(sysCtx);
  const [draftAct, setDraftAct] = useState(sysAct);
  const [draftExp, setDraftExp] = useState(sysExp);
  const [draftInv, setDraftInv] = useState(sysInv);
  const [draftGym, setDraftGym] = useState(sysGym);
  const [draftSkill, setDraftSkill] = useState(sysSkill);
  const [draftSpirit, setDraftSpirit] = useState(sysSpirit);
  const [customTabs, setCustomTabs] = useLocalStorage("custom_tabs", []);
  const [draftCustom, setDraftCustom] = useState(Array.isArray(customTabs) ? customTabs : []);

  const save = () => { setApiKey(draftApi); setSysCtx(draftCtx); setSysAct(draftAct); setSysExp(draftExp); setSysInv(draftInv); setSysGym(draftGym); setSysSkill(draftSkill); setSysSpirit(draftSpirit); alert("Saved!"); };
  const saveCustom = () => { setCustomTabs(draftCustom); alert("Layout Saved!"); };
  const exportData = () => { const d = {}; for(let i=0; i<localStorage.length; i++){ const k=localStorage.key(i); d[k]=localStorage.getItem(k); } const b=new Blob([JSON.stringify(d)],{type:"application/json"}); const u=URL.createObjectURL(b); const a=document.createElement("a"); a.href=u; a.download="James_Backup.json"; a.click(); };
  const importData = (e) => { const f=e.target.files[0]; if(!f)return; const r=new FileReader(); r.onload=(ev)=>{ try{ const d=JSON.parse(ev.target.result); Object.keys(d).forEach(k=>localStorage.setItem(k,d[k])); alert("Imported!"); window.location.reload(); }catch(err){alert("Error");} }; r.readAsText(f); };

  return <div>
    <div className="card">
      <h3>Configuration</h3>
      <span className="lbl">Gemini Key</span>
      <input type="password" value={draftApi} onChange={e=>setDraftApi(e.target.value)} className="inp"/>
      <span className="lbl">Strategic Persona</span>
      <textarea rows={4} value={draftCtx} onChange={e=>setDraftCtx(e.target.value)} className="inp"/>
      <span className="lbl">Journal Tags</span>
      <input value={draftAct} onChange={e=>setDraftAct(e.target.value)} className="inp"/>
      <span className="lbl">Expense Tags</span>
      <input value={draftExp} onChange={e=>setDraftExp(e.target.value)} className="inp"/>
      <span className="lbl">Investment Tags</span>
      <input value={draftInv} onChange={e=>setDraftInv(e.target.value)} className="inp"/>
      <span className="lbl">Gym Tags</span>
      <input value={draftGym} onChange={e=>setDraftGym(e.target.value)} className="inp"/>
      <span className="lbl">Skill Tags</span>
      <input value={draftSkill} onChange={e=>setDraftSkill(e.target.value)} className="inp"/>
      <span className="lbl">Spirit Tags</span>
      <input value={draftSpirit} onChange={e=>setDraftSpirit(e.target.value)} className="inp"/>
      <button onClick={save} className="pbtn">Save Configuration</button>
    </div>
    <div className="card">
      <h3>My Custom Slots</h3>
      {draftCustom.map((t, i) => (
        <div key={t.id} style={{marginBottom:12, padding:10, background:"#F2F2F7", borderRadius:12}}>
          <div style={{display:"flex", gap:8}}>
            <input value={t.icon} onChange={e=>{const n=[...draftCustom]; n[i].icon=e.target.value; setDraftCustom(n);}} className="inp" style={{width:50}}/>
            <input value={t.label} onChange={e=>{const n=[...draftCustom]; n[i].label=e.target.value; setDraftCustom(n);}} className="inp"/>
            <button onClick={()=>setDraftCustom(draftCustom.filter(x=>x.id!==t.id))} className="dbtn">×</button>
          </div>
          <input value={t.tags||""} onChange={e=>{const n=[...draftCustom]; n[i].tags=e.target.value; setDraftCustom(n);}} className="inp" placeholder="Tags..."/>
        </div>
      ))}
      <button onClick={()=>setDraftCustom([...draftCustom, {id:"tab_"+Date.now(), icon:"📝", label:"New Tab", tags:"General"}])} className="pbtn" style={{background:"transparent", color:"#5E5CE6", border:"1px solid #5E5CE6", boxShadow:"none"}}>+ Add Tab</button>
      <button onClick={saveCustom} className="pbtn" style={{marginTop:10}}>Save Layout</button>
    </div>
    <div className="card" style={{border: "1.5px dashed #C7C7CC"}}>
      <h3>Archive Protection</h3>
      <div style={{display:"flex", gap:10, marginBottom:16}}>
        <button onClick={exportData} className="pbtn" style={{flex:1}}>Export</button>
        <button onClick={()=>{if(window.confirm("Reset?")){localStorage.clear(); window.location.reload();}}} className="pbtn" style={{flex:1, background:"#FF3B30"}}>Reset</button>
      </div>
      <input type="file" accept=".json" onChange={importData} style={{fontSize:12, width:"100%"}}/>
    </div>
  </div>;
}

function Prophecy({ sessionKey }){
  const [timeframe, setTimeframe] = useState("1 Day");
  const [mode, setMode] = useState("both");
  const [actEntries] = useSecureStorage("entries_activity", [], sessionKey);
  const dates = [...new Set(actEntries.map(e => e.date))];
  const cats = [...new Set(actEntries.filter(e => e.date === fmtDate()).map(e => e.cat))];
  const req = timeframe === "1 Day" ? cats.length >= 5 : timeframe === "1 Week" ? dates.length >= 5 : timeframe === "1 Month" ? dates.length >= 21 : dates.length >= 52;
  const lockMsg = timeframe === "1 Day" ? `Need 5 categories today (You have ${cats.length}).` : timeframe === "1 Week" ? `Need 5 unique days (${dates.length}).` : timeframe === "1 Month" ? `Need 21 unique days (${dates.length}).` : `Need 52 unique days (${dates.length}).`;
  return <div>
    <div className="card" style={{background: "linear-gradient(135deg, #1C1C1E 0%, #2C2C2E 100%)", textAlign: "center", padding: 28}}><div style={{fontSize: 48}}>🎬</div><h2 style={{color: "#F2F2F7"}}>Life Prophecy</h2></div>
    <div className="card">
      <span className="lbl">Timeframe</span>
      <div style={{display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 8, marginBottom: 20}}>
        {["1 Day", "1 Week", "1 Month", "1 Year"].map(t => <button key={t} onClick={() => setTimeframe(t)} style={{padding: "12px 4px", borderRadius: 14, background: timeframe === t ? "#5E5CE6" : "#F2F2F7", color: timeframe === t ? "#fff" : "#3A3A3C", fontWeight: 700}}>{t}</button>)}
      </div>
      <span className="lbl">Mode</span>
      <div style={{display:"flex", flexDirection:"column", gap:10, marginBottom:20}}>
        {[{id:"current",l:"⚠️ Current Path"},{id:"heroic",l:"🦁 Heroic Path"},{id:"both",l:"🎬 Full Movie"}].map(m => <button key={m.id} onClick={()=>setMode(m.id)} style={{padding:"14px 16px", borderRadius:16, background:mode===m.id?"#EEF0FF":"#F2F2F7", textAlign:"left", fontWeight:700}}>{m.l}</button>)}
      </div>
      {req ? <AIBtn label="Generate Vision" prompt={`Predict ${timeframe} based on current discipline.`} sessionKey={sessionKey} /> : <div style={{color:"#FF3B30", fontSize:13, textAlign:"center"}}>{lockMsg}</div>}
    </div>
    <div className="card" style={{background:"#F2F2F7", border:"none"}}>
      <span className="lbl">How it Works</span>
      {[["📝", "Log Daily", "The more you log, the sharper the vision."],["🎬", "Milestones", "Longer visions require more consistency."],["🤖", "AI Story", "A cinematic future narrative based on habits."]].map(([i,t,d])=><div key={t} style={{display:"flex", gap:14, marginBottom:16}}><span style={{fontSize:24}}>{i}</span><div><div style={{fontSize:14, fontWeight:700}}>{t}</div><div style={{fontSize:12, color:"#8E8E93"}}>{d}</div></div></div>)}
    </div>
  </div>;
}

function App(){
  const VALID_HASHES = ["06010538dc6f364bd7d2a9a1f707d97a2894bb00216482d75effffa6c2a1570e"]; //For KRISHNA-270493
  const [sessionKey, setSessionKey] = useState(sessionStorage.getItem("active_key") || null);
  const [pinAttempt, setPinAttempt] = useState("");
  const [tab, setTab] = useState("activity");
  const [showMore, setShowMore] = useState(false);
  const [customTabs] = useLocalStorage("custom_tabs", []);
  
  const handleUnlock = () => { if (CryptoJS.SHA256(pinAttempt.trim()).toString() === VALID_HASHES[0]) { setSessionKey(pinAttempt.trim()); sessionStorage.setItem("active_key", pinAttempt.trim()); } else { alert("Denied"); setPinAttempt(""); } };
  if (!sessionKey) return <div style={{maxWidth: 520, margin: "0 auto", height: "100vh", display: "flex", flexDirection: "column", justifyContent: "center", padding: 20}}><div className="card" style={{textAlign: "center"}}><div style={{fontSize: 50}}>🛡️</div><h2>James Chronicles</h2><input type="password" value={pinAttempt} onChange={e=>setPinAttempt(e.target.value)} placeholder="PIN..." className="inp" style={{textAlign:"center", marginTop:12}}/><button onClick={handleUnlock} className="pbtn">Unlock</button></div></div>;
  
  return <div style={{maxWidth: 520, margin: "0 auto", padding: "40px 20px 100px"}}>
    <h4 style={{fontSize:12, color:"#5E5CE6", letterSpacing:2}}>JAMES CHRONICLES</h4>
    <h1 style={{fontSize:34}}>Good Day, James.</h1>
    <div style={{marginTop: 20}}>
      {tab === "activity" && <Activity sessionKey={sessionKey}/>}
      {tab === "finance" && <Finance sessionKey={sessionKey}/>}
      {tab === "gym" && <GenericLogger sectionId="gym" title="Gym" icon="◈" tagsStr={localStorage.getItem("sys_gym")||"Push,Pull,Legs,Core,Cardio,Yoga,Rest"} sessionKey={sessionKey}/>}
      {tab === "skills" && <GenericLogger sectionId="skills" title="Skill" icon="◑" tagsStr={localStorage.getItem("sys_skill")||"AI,PMP,Other"} sessionKey={sessionKey}/>}
      {tab === "spiritual" && <Spiritual sessionKey={sessionKey}/>}
      {tab === "prophecy" && <Prophecy sessionKey={sessionKey}/>}
      {tab === "settings" && <Settings sessionKey={sessionKey}/>}
      {customTabs.map(t => tab === t.id && <GenericLogger key={t.id} sectionId={t.id} title={t.label} icon={t.icon} tagsStr={t.tags} sessionKey={sessionKey}/>)}
    </div>
    {showMore && (
      <div style={{position:"fixed", bottom:90, left:"50%", transform:"translateX(-50%)", width:"calc(100% - 40px)", maxWidth:480, background:"#fff", borderRadius:24, padding:16, boxShadow:"0 -4px 30px rgba(0,0,0,0.12)", zIndex:800, display:"flex", flexWrap:"wrap", gap:8}}>
        <button onClick={()=>{setTab("prophecy"); setShowMore(false);}} style={{flex:"1 1 48%", padding:14, borderRadius:16, background:"#F2F2F7", border:"none"}}>🎬 Prophecy</button>
        {customTabs.map(t => <button key={t.id} onClick={()=>{setTab(t.id); setShowMore(false);}} style={{flex:"1 1 48%", padding:14, borderRadius:16, background:"#F2F2F7", border:"none"}}>{t.icon} {t.label}</button>)}
      </div>
    )}
    <div className="nav">
      {[["activity","◎","Log"],["finance","₹","Ledger"],["gym","◈","Gym"],["skills","◑","Skill"],["spiritual","✦","Spirit"]].map(([id,icon,label])=>(
        <button key={id} className="nb" onClick={()=>{setTab(id); setShowMore(false);}}><span style={{fontSize:22, color:tab===id?"#5E5CE6":"#C7C7CC"}}>{icon}</span><span style={{fontSize:10, color:tab===id?"#5E5CE6":"#C7C7CC"}}>{label}</span></button>
      ))}
      <button className="nb" onClick={()=>setShowMore(!showMore)}><span style={{fontSize:22, color:showMore?"#5E5CE6":"#C7C7CC"}}>••••</span><span style={{fontSize:10, color:showMore?"#5E5CE6":"#C7C7CC"}}>More</span></button>
      <button className="nb" onClick={()=>{setTab("settings"); setShowMore(false);}}><span style={{fontSize:22, color:tab==="settings"?"#5E5CE6":"#C7C7CC"}}>⚙</span><span style={{fontSize:10, color:tab==="settings"?"#5E5CE6":"#C7C7CC"}}>Config</span></button>
    </div>
  </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
